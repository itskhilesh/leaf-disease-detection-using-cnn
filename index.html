<html lang="en"><head>

<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#dff3e6;color:#14281d;font-family:'Hind','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px}
.fd{font-family:'Fraunces','Hind',Georgia,serif}
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,rgba(5,46,34,.78),rgba(16,110,76,.5));backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 40px 80px -30px rgba(6,60,40,.6)}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;filter:blur(50px);pointer-events:none}
.hero::before{width:300px;height:300px;right:-60px;top:-80px;background:#bef264;opacity:.55}
.hero::after{width:260px;height:260px;left:30%;bottom:-120px;background:#fbbf24;opacity:.4}
.hero>*{position:relative;z-index:1}
.gt{background:linear-gradient(180deg,#fff 30%,#a7f3d0);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.64),rgba(255,255,255,.26));backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 14px 34px -14px rgba(6,78,59,.35)}
.glass input,.glass select{background:rgba(255,255,255,.6)!important}
.navon{background:linear-gradient(135deg,#10b981,#047857);color:#fff;box-shadow:0 8px 20px -8px #047857}
.bgfield{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1100px 650px at 85% -10%,#fdeba8 0,transparent 60%),radial-gradient(900px 600px at 0% 20%,#b7f0d0 0,transparent 60%),linear-gradient(180deg,#e9f7ee 0,#cdeedc 55%,#7fc8a0 100%)}
.bgfield i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.65}
.hills{position:absolute;left:0;bottom:0;width:100%;height:40vh}
.chip{position:absolute;display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:#064e3b;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border:1px solid #fff;box-shadow:0 8px 24px -10px rgba(0,0,0,.4);white-space:nowrap}
@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(200px)}}
.scanline{animation:scan 4s ease-in-out infinite;filter:drop-shadow(0 0 6px #fff)}
@media(prefers-reduced-motion:reduce){.scanline{animation:none}}
.text-slate-500{color:#3f5a4b}.text-slate-600{color:#2f4a3b}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s ease both}
@media(prefers-reduced-motion:reduce){.rise{animation:none}}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid #34d399;outline-offset:2px}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-layer,.leaflet-tile-container,.leaflet-zoom-box{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;position:relative;background:#dcefe3;outline:0;font:inherit;touch-action:none}
.leaflet-tile{visibility:hidden;user-select:none;max-width:none!important}.leaflet-tile-loaded{visibility:inherit}
.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-pane{z-index:400}
.leaflet-map-pane svg{position:absolute}.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both;margin:10px}.leaflet-right .leaflet-control{float:right}.leaflet-bottom .leaflet-control{margin:0}
.leaflet-control-zoom{border-radius:10px;overflow:hidden;box-shadow:0 1px 4px #0003}
.leaflet-control-zoom a{display:block;width:34px;height:34px;line-height:34px;text-align:center;background:#fff;color:#065f46;font-weight:800;text-decoration:none;border-bottom:1px solid #e5e7eb}
.leaflet-control-attribution{font-size:10px;background:#fffc;padding:0 5px}.leaflet-control-attribution a{color:#065f46}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}
</style></head>
<body><div id="root"></div>
<script>
const{useState,useEffect,useRef}=React,html=htm.bind(React.createElement);
const API='/api';let LANG='en';
const T={en:{home:'Home',dash:'Dashboard',soil:'Soil Intelligence',detect:'Detect Disease',iot:'IoT Monitor',profile:'Reports & Profile',tag:'Smarter Farming. Healthier Crops. Better Tomorrow.',sub:'Photograph a leaf, find out what is wrong, and see what your soil, weather and sensors say about your field.',cta1:'Detect Disease',cta2:'Explore Dashboard',demo:'DEMO DATA',est:'ESTIMATE · REGIONAL',health:'Crop health',moist:'Soil moisture',temp:'Temperature',hum:'Humidity',ph:'Soil pH',light:'Light',weather:'Weather forecast',recent:'Recent activity',alerts:'Alerts',gps:'Use my GPS location',apply:'Save location',upload:'Upload photo',camera:'Take photo',analyse:'Analyse leaf',crop:'Crop',village:'Village',district:'District',state:'State',pin:'PIN code'},
hi:{home:'मुख्य पृष्ठ',dash:'डैशबोर्ड',soil:'मिट्टी की जानकारी',detect:'रोग पहचानें',iot:'IoT निगरानी',profile:'रिपोर्ट व प्रोफ़ाइल',tag:'स्मार्ट खेती. स्वस्थ फसल. बेहतर कल.',sub:'पत्ती की फोटो लें, रोग जानें, और अपने खेत की मिट्टी, मौसम और सेंसर की जानकारी देखें।',cta1:'रोग पहचानें',cta2:'डैशबोर्ड देखें',demo:'डेमो डेटा',est:'अनुमान · क्षेत्रीय',health:'फसल स्वास्थ्य',moist:'मिट्टी की नमी',temp:'तापमान',hum:'आर्द्रता',ph:'मिट्टी pH',light:'प्रकाश',weather:'मौसम पूर्वानुमान',recent:'हाल की गतिविधि',alerts:'चेतावनियाँ',gps:'GPS से स्थान लें',apply:'स्थान सहेजें',upload:'फोटो अपलोड करें',camera:'फोटो खींचें',analyse:'पत्ती जाँचें',crop:'फसल',village:'गाँव',district:'ज़िला',state:'राज्य',pin:'पिन कोड'}};
const t=k=>(T[LANG]&&T[LANG][k])||T.en[k]||k;

// Regional soil profiles (broad zones, NOT field-level data). c = zone centre [lat,lon]
const R=[
{n:'Central black-soil belt',st:'Madhya Pradesh, Maharashtra, east Gujarat',c:[21.5,77],s:'Black soil (regur/Vertisol), medium black on uplands and deep black in valleys',ph:'7.0–8.5',f:'High clay, holds moisture, rich in calcium and potash; usually low in nitrogen, phosphorus and organic matter. Cracks when dry, sticky when wet.',cr:'Soybean, cotton, wheat, gram, sorghum, pigeon pea',cl:'Semi-arid to sub-humid; monsoon Jun–Sep, about 700–1200 mm',k:['Soybean','Cotton','Pigeon pea'],r:['Wheat','Chickpea','Safflower']},
{n:'Western Gangetic alluvium',st:'Punjab, Haryana, Delhi, west Uttar Pradesh',c:[29.5,76.5],s:'Alluvial loam to sandy loam; saline-alkaline patches',ph:'7.0–8.5',f:'Fertile and well drained; responds strongly to nitrogen. Zinc deficiency and salinity occur in patches.',cr:'Wheat, rice, sugarcane, mustard, potato',cl:'Semi-arid; hot summers, cold winters; irrigation-dependent',k:['Rice','Maize','Cotton'],r:['Wheat','Mustard','Potato']},
{n:'Eastern Gangetic alluvium',st:'East Uttar Pradesh, Bihar, West Bengal',c:[24.5,87.5],s:'Alluvial (young Khadar and older Bhangar); clayey in the delta',ph:'6.0–8.0',f:'Highly fertile with a high water table; flood-prone. Check zinc and boron.',cr:'Rice, wheat, jute, maize, lentil, vegetables',cl:'Humid subtropical; heavy monsoon, 1000–1600 mm',k:['Rice','Jute','Maize'],r:['Wheat','Lentil','Potato']},
{n:'Arid western zone',st:'West Rajasthan, Kutch',c:[26.5,72],s:'Arid sandy soils, gravelly in patches',ph:'7.5–9.0',f:'Low organic matter and water holding capacity; low nitrogen and phosphorus; wind erosion risk.',cr:'Pearl millet (bajra), cluster bean, moth bean, mustard',cl:'Arid; under 400 mm rain; extreme temperatures',k:['Bajra','Cluster bean','Moong'],r:['Mustard','Barley','Cumin']},
{n:'Eastern red and laterite plateau',st:'Jharkhand, Odisha, Chhattisgarh',c:[22.3,84.5],s:'Red and yellow soils; lateritic on uplands; alluvium in river basins',ph:'5.0–6.5',f:'Acidic, light-textured, low in nitrogen, phosphorus and organic matter; benefits from lime and compost.',cr:'Rice, maize, pulses, oilseeds, millets, vegetables',cl:'Sub-humid tropical; monsoon 1100–1500 mm',k:['Rice','Maize','Pigeon pea','Millets'],r:['Gram','Mustard','Vegetables']},
{n:'Deccan red-black region',st:'North Karnataka, Telangana, Andhra Pradesh',c:[16,78],s:'Red sandy loam mixed with black soils',ph:'6.0–8.0',f:'Red soils are low in fertility and hold little water; black soils are moisture-rich. Needs nitrogen, phosphorus and zinc.',cr:'Cotton, groundnut, sorghum, pulses, chilli, irrigated rice',cl:'Semi-arid tropical; erratic rain, 600–900 mm',k:['Cotton','Groundnut','Red gram'],r:['Sorghum','Chickpea','Sunflower']},
{n:'Southern red and laterite',st:'Tamil Nadu, Kerala, south Karnataka',c:[11,78.5],s:'Red loam, laterite and coastal alluvium',ph:'5.0–7.0',f:'Acidic and well drained; nutrients leach easily, so organic matter matters.',cr:'Rice, coconut, banana, millets, plantation crops, vegetables',cl:'Tropical; south-west and north-east monsoons',k:['Rice','Millets','Groundnut'],r:['Rice','Pulses','Vegetables']},
{n:'Himalayan mountain zone',st:'Himachal Pradesh, Uttarakhand, Jammu & Kashmir',c:[32,77.5],s:'Shallow stony mountain and forest soils; valley alluvium',ph:'5.0–7.0',f:'High organic matter under forest; erosion risk on slopes, so terracing is important.',cr:'Apple, potato, maize, wheat, rajma, vegetables',cl:'Temperate to alpine; snow at altitude',k:['Maize','Potato','Rajma'],r:['Wheat','Barley','Peas']},
{n:'North-eastern hills and plains',st:'Assam, Meghalaya and neighbours',c:[26,92.5],s:'Alluvium in the Brahmaputra valley; acidic red-yellow and lateritic soils on hills',ph:'4.5–6.5',f:'Acidic with heavy leaching but high organic matter; lime usually helps.',cr:'Rice, tea, jute, citrus, vegetables',cl:'Humid; very heavy rain, 2000 mm and above',k:['Rice','Jute','Maize'],r:['Mustard','Potato','Pulses']},
{n:'Konkan and west coast',st:'Konkan, Goa, coastal Karnataka',c:[17,73.5],s:'Lateritic and coastal sandy soils',ph:'5.0–6.5',f:'Acidic, low fertility and strong leaching; responds well to organic inputs.',cr:'Rice, coconut, cashew, mango, areca nut',cl:'Humid tropical; 2000–3500 mm rain',k:['Rice','Finger millet','Vegetables'],r:['Pulses','Vegetables']}];
const SM={'Madhya Pradesh':0,Maharashtra:0,Gujarat:0,Punjab:1,Haryana:1,Delhi:1,'Uttar Pradesh':2,Bihar:2,'West Bengal':2,Rajasthan:3,Jharkhand:4,Odisha:4,Chhattisgarh:4,Karnataka:5,Telangana:5,'Andhra Pradesh':5,'Tamil Nadu':6,Kerala:6,'Himachal Pradesh':7,Uttarakhand:7,'Jammu & Kashmir':7,Assam:8,Meghalaya:8,Goa:9};
const near=([a,b])=>R.reduce((x,r,i)=>{const d=(r.c[0]-a)**2+((r.c[1]-b)*Math.cos(a*Math.PI/180))**2;return d<x.d?{d,i}:x},{d:1e9,i:0}).i;

// Disease guidance keyed by normalised model label. Shown only when the real model returns that label.
const KB={'tomato late blight':['High','Dark, water-soaked patches on leaves and stems; white mould underneath in humid weather; spreads fast.','Remove and destroy infected plants; water at the base, not overhead; use certified seed; ask the local agriculture officer which fungicide suits your area'],
'tomato early blight':['Moderate','Brown spots with ring patterns on older leaves, yellowing around the spots.','Rotate crops every season; mulch the soil; remove lower infected leaves; keep foliage dry'],
'potato late blight':['High','Dark blotches on leaves that turn brown and papery; white growth on the underside in damp weather; tubers rot.','Plant certified seed tubers; avoid waterlogging; destroy infected haulms; follow local spray advisories'],
'corn common rust':['Moderate','Small reddish-brown pustules on both leaf surfaces.','Choose resistant hybrids; sow early; scout fields weekly'],
'corn northern leaf blight':['Moderate to high','Long grey-green or tan cigar-shaped lesions on leaves.','Rotate with non-cereal crops; bury crop residue; use resistant varieties'],
healthy:['None','The model sees no signs of disease on this leaf.','Keep checking weekly; irrigate at the base; maintain balanced nutrition']};
const norm=l=>l.replace(/\(.*?\)/g,'').replace(/_+/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
const pretty=l=>{const p=l.replace(/\(.*?\)/g,'').split(/_{2,}/).pop().replace(/_+/g,' ').trim();return p.charAt(0).toUpperCase()+p.slice(1)};
async function predict(file,crop){const f=new FormData();f.append('image',file);f.append('crop',crop);const r=await fetch(API+'/predict',{method:'POST',body:f});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(typeof j.label!=='string'||typeof j.confidence!=='number'||j.confidence<0||j.confidence>1)throw new Error('Unexpected response');return j}

const M=[['m','💧','moist','%','#059669'],['t','🌡️','temp','°C','#c2570c'],['h','☁️','hum','%','#0284c7'],['ph','🧪','ph','','#7c4a2d'],['l','☀️','light','%','#b7791f']];
const gen=i=>({m:Math.round(46+16*Math.sin(i/4)+(i*7)%5),t:+(27+6*Math.sin(i/5)+((i*3)%4)/4).toFixed(1),h:Math.round(62+14*Math.cos(i/6)+(i*5)%4),ph:+(6.7+.3*Math.sin(i/9)).toFixed(1),l:Math.round(55+40*Math.sin(i/3.8))});
const alertsOf=l=>[l.m<32&&['warn','Soil moisture is low. Irrigation may be needed.'],l.m>80&&['warn','Soil is very wet. Check drainage.'],l.t>36&&['bad','High temperature. Heat stress risk.'],l.h>78&&['warn','High humidity. Watch for fungal disease.'],(l.ph<5.5||l.ph>8)&&['warn','Soil pH is outside 5.5–8.0.']].filter(Boolean);

function useSensors(){const[s,setS]=useState(()=>Array.from({length:24},(_,i)=>gen(i))),[live,setLive]=useState(false),lr=useRef(false);
useEffect(()=>{let n=24,on=true;const id=setInterval(async()=>{try{const r=await fetch(API+'/sensors/latest');if(!r.ok)throw 0;const j=await r.json();if(M.some(m=>typeof j[m[0]]!=='number'))throw 0;if(!on)return;setLive(true);if(!lr.current){lr.current=true;setS([j])}else setS(a=>[...a.slice(-23),j])}catch(e){if(on&&!lr.current){setLive(false);setS(a=>[...a.slice(-23),gen(n++)])}}},5000);return()=>{on=false;clearInterval(id)}},[]);
return{s,live,last:s[s.length-1]}}
function useWeather(ll){const[w,setW]=useState({s:'idle'});useEffect(()=>{if(!ll){setW({s:'idle'});return}setW({s:'load'});const ac=new AbortController();fetch('https://api.open-meteo.com/v1/forecast?latitude='+ll[0]+'&longitude='+ll[1]+'&current=temperature_2m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&forecast_days=5',{signal:ac.signal}).then(r=>r.ok?r.json():Promise.reject()).then(j=>setW({s:'ok',j})).catch(e=>{if(!e||e.name!=='AbortError')setW({s:'err'})});return()=>ac.abort()},[ll&&ll.join()]);return w}

const Demo=()=>html`<span className="text-[11px] font-bold bg-amber-100 text-amber-900 border border-amber-300 rounded-full px-2 py-0.5 whitespace-nowrap">${t('demo')}</span>`;
const Card=({c='',children})=>html`<div className=${'glass rounded-3xl p-4 md:p-5 '+c}>${children}</div>`;
const H=({children})=>html`<h2 className="fd text-2xl font-extrabold text-emerald-950">${children}</h2>`;
const Note=({k='info',children})=>html`<div className=${'rounded-xl border px-3 py-2 text-sm '+(k==='bad'?'bg-red-50 border-red-200 text-red-900':k==='warn'?'bg-amber-50 border-amber-200 text-amber-900':'bg-emerald-50 border-emerald-200 text-emerald-900')}>${children}</div>`;

function Chart({d,color,u=''}){const[i,setI]=useState(null),w=300,h=100,p=6,mx=Math.max(...d),mn=Math.min(...d),x=k=>p+k*(w-2*p)/Math.max(d.length-1,1),y=v=>h-p-(v-mn)/((mx-mn)||1)*(h-2*p-16),pts=d.map((v,k)=>x(k)+','+y(v)).join(' '),sel=i===null?d.length-1:i;
return html`<svg viewBox=${'0 0 '+w+' '+h} className="w-full touch-none" role="img" aria-label="Trend chart" onMouseMove=${e=>{const r=e.currentTarget.getBoundingClientRect();setI(Math.max(0,Math.min(d.length-1,Math.round((e.clientX-r.left)/r.width*(d.length-1)))))}} onMouseLeave=${()=>setI(null)}><polygon points=${p+','+(h-p)+' '+pts+' '+(w-p)+','+(h-p)} fill=${color} opacity=".14"/><polyline points=${pts} fill="none" stroke=${color} strokeWidth="2.5" strokeLinejoin="round"/><circle cx=${x(sel)} cy=${y(d[sel])} r="4.5" fill=${color}/><text x="6" y="11" fontSize="11" fill="#475569">${d[sel]+u}</text></svg>`}

function Strata(){return html`<svg viewBox="0 0 360 300" className="w-full max-w-md rounded-2xl" role="img" aria-label="Field cross-section: regional soil estimate beside a sensor probe">
<rect width="360" height="90" fill="#d6efe0"/><circle cx="310" cy="34" r="18" fill="#fde68a"/>
<rect y="90" width="360" height="52" fill="#5b3a24"/><rect y="142" width="360" height="58" fill="#7c4a2d"/><rect y="200" width="360" height="55" fill="#a35f3a"/><rect y="255" width="360" height="45" fill="#c9b08a"/>
<g stroke="#16a34a" strokeWidth="4" fill="none" strokeLinecap="round"><path d="M50 90V60M50 74q-13-3-15-15M50 70q13-3 15-15"/><path d="M130 90V56M130 72q-13-3-15-15M130 68q13-3 15-15"/><path d="M210 90V62M210 76q-13-3-15-15M210 72q13-3 15-15"/></g>
<g stroke="#e9d8bd" strokeWidth="2" fill="none"><path d="M50 90v45M50 110q-12 8-14 24M50 118q12 6 14 20M130 90v50M130 112q-12 8-14 24M210 90v40M210 108q12 8 14 22"/></g>
<rect x="288" y="70" width="12" height="150" rx="5" fill="#e5e7eb"/><circle cx="294" cy="120" r="5" fill="#10b981"/><circle cx="294" cy="170" r="5" fill="#10b981"/>
<g fill="#fff" fontSize="13" fontWeight="600"><text x="12" y="122">Topsoil</text><text x="12" y="176">Subsoil</text><text x="12" y="232">Murrum / laterite</text><text x="12" y="282" fill="#3b2a14">Parent rock</text></g>
<text x="12" y="20" fontSize="12" fill="#14532d" fontWeight="600">Regional estimate: layers on the left</text><text x="196" y="54" fontSize="12" fill="#14532d" fontWeight="600" textAnchor="start"></text><text x="272" y="62" fontSize="12" fill="#14532d" fontWeight="600" textAnchor="end">Sensor reading</text></svg>`}

const Scan=()=>html`<div className="relative w-full max-w-sm mx-auto aspect-[4/5]" role="img" aria-label="Illustration of a leaf being scanned"><div className="glass absolute inset-4 rounded-[2rem] overflow-hidden"><svg viewBox="0 0 240 300" className="w-full h-full"><defs><linearGradient id="lf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#bef264"/><stop offset="1" stopColor="#059669"/></linearGradient></defs><path d="M120 40C200 80 210 190 120 262C30 190 40 80 120 40Z" fill="url(#lf)"/><path d="M120 60V252M120 110L84 140M120 110L156 140M120 160L78 196M120 160L162 196" stroke="#065f46" strokeOpacity=".5" strokeWidth="3" fill="none" strokeLinecap="round"/><path d="M24 54V30H48M216 54V30H192M24 246V270H48M216 246V270H192" stroke="#fff" strokeWidth="3" fill="none" strokeLinecap="round"/><rect className="scanline" x="30" y="40" width="180" height="3" rx="2" fill="#fff"/></svg></div><span className="chip" style=${{top:'6%',left:'-4%'}}>🍃 Leaf photo in</span><span className="chip" style=${{top:'46%',right:'-6%'}}>🗺️ Soil: regional estimate</span><span className="chip" style=${{bottom:'8%',left:'2%'}}>📡 Sensors: demo data</span></div>`;
const F=[['🍃','Leaf disease detection','A MobileNetV2 CNN classifies leaf photos as healthy or infected and returns symptoms and prevention steps.'],['🗺️','Soil intelligence','Pin your farm by GPS, PIN code or map to see the soil type, fertility, climate and crops of your region.'],['📡','Field sensors','ESP32 boards report soil moisture, temperature, humidity, pH and light, with alerts when something drifts.'],['⛅','Weather forecast','Five-day forecast for your farm location to plan irrigation, spraying and harvest.'],['🌾','Crop suggestions','Kharif and Rabi crops that suit your regional soil and climate.'],['📄','Reports','Save a summary of your farm, soil, sensor readings and scans.']];
function Home(){return html`<div className="space-y-10">
<section className="hero rounded-[2rem] text-white p-6 md:p-12 grid md:grid-cols-2 gap-8 items-center rise">
<div>
<h1 className="fd gt text-6xl md:text-8xl font-extrabold leading-[.95] tracking-tight mt-3">AgroVision AI</h1>
<p className="fd text-xl md:text-2xl mt-3 text-emerald-50">${t('tag')}</p><p className="mt-4 text-emerald-100/90 max-w-md">${t('sub')}</p>
<div className="mt-6 flex flex-wrap gap-3"><a href="#detect" className="bg-lime-300 text-emerald-950 font-semibold rounded-xl px-5 py-3 hover:bg-lime-200">🍃 ${t('cta1')}</a><a href="#dashboard" className="border border-white/40 font-semibold rounded-xl px-5 py-3 hover:bg-white/10">📊 ${t('cta2')}</a></div></div>
<div className="flex justify-center"><${Scan}/></div></section>
<section><${H}>What it does<//><div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">${F.map(f=>html`<${Card} key=${f[1]}><div className="text-3xl">${f[0]}</div><h3 className="font-semibold text-lg mt-2">${f[1]}</h3><p className="text-sm text-slate-600 mt-1">${f[2]}</p><//>`)}</div></section>
<section className="grid md:grid-cols-2 gap-4"><${Card}><${H}>Project overview<//><p className="mt-2 text-slate-700">Many small farms lose crops because a disease is spotted late and soil advice is too general. AgroVision AI combines a leaf-image classifier, regional soil knowledge and low-cost ESP32 sensors so a farmer can act early, in Hindi or English.</p><//>
<${Card}><${H}>Built with<//><div className="flex flex-wrap gap-2 mt-3 text-sm">${['React','Tailwind CSS','Leaflet + OpenStreetMap','Flask / FastAPI','TensorFlow / Keras','MobileNetV2','MySQL / Firebase','Arduino / ESP32','ESP32-CAM'].map(s=>html`<span key=${s} className="bg-emerald-50 text-emerald-900 border border-emerald-200 rounded-full px-3 py-1">${s}</span>`)}</div><//></section></div>`}

function Dash({hist,act,sens,w,loc}){const l=sens.last,last=hist[0],al=alertsOf(l),dis=hist.filter(h=>!h.healthy).slice(0,2);
return html`<div className="space-y-5"><${H}>${t('dash')}<//>
<div className="grid grid-cols-2 lg:grid-cols-5 gap-3">
<${Card} c="col-span-2 lg:col-span-1"><p className="text-sm text-slate-500">🌱 ${t('health')}</p>${last?html`<p className=${'fd text-xl font-extrabold mt-1 '+(last.healthy?'text-emerald-700':'text-red-700')}>${last.healthy?'Healthy':last.name}</p><p className="text-xs text-slate-500">${last.crop}, last scan</p>`:html`<p className="fd text-xl font-extrabold mt-1 text-slate-400">No scan yet</p><a href="#detect" className="text-sm text-emerald-700 underline">Scan a leaf</a>`}<//>
${M.slice(0,4).map(m=>html`<${Card} key=${m[0]}><div className="flex justify-between items-start"><p className="text-sm text-slate-500">${m[1]} ${t(m[2])}</p>${!sens.live&&html`<${Demo}/>`}</div><p className="fd text-3xl font-extrabold mt-1">${l[m[0]]}<span className="text-base text-slate-500">${m[3]}</span></p><//>`)}</div>
<div className="grid lg:grid-cols-3 gap-4">
<${Card} c="lg:col-span-2"><div className="flex justify-between"><h3 className="font-semibold">${t('moist')} and ${t('temp').toLowerCase()}, last 24 readings</h3>${!sens.live&&html`<${Demo}/>`}</div><div className="grid sm:grid-cols-2 gap-4 mt-2"><${Chart} d=${sens.s.map(x=>x.m)} color="#059669" u="%"/><${Chart} d=${sens.s.map(x=>x.t)} color="#c2570c" u="°C"/></div><//>
<${Card}><h3 className="font-semibold mb-2">${t('weather')}</h3><${Wx} w=${w} loc=${loc}/><//></div>
<div className="grid md:grid-cols-2 gap-4"><${Card}><h3 className="font-semibold mb-2">${t('alerts')}</h3><div className="space-y-2">${dis.map(d=>html`<${Note} k="bad" key=${d.when}>Disease found on ${d.crop}: ${d.name}<//>`)}${al.map(a=>html`<${Note} k=${a[0]} key=${a[1]}>${a[1]}${!sens.live&&' (demo data)'}<//>`)}${!al.length&&!dis.length&&html`<p className="text-sm text-slate-500">No active alerts.</p>`}</div><//>
<${Card}><h3 className="font-semibold mb-2">${t('recent')}</h3><ul className="space-y-2 text-sm">${act.map((a,i)=>html`<li key=${i} className="flex gap-3"><span className="text-slate-400 w-12 shrink-0">${a.t}</span><span>${a.m}</span></li>`)}</ul><//></div></div>`}

function Wx({w,loc}){if(w.s==='idle')return html`<p className="text-sm text-slate-600">Set your farm on a map or with GPS in <a className="underline text-emerald-700" href="#soil">Soil Intelligence</a> to get a forecast. Manual village entry alone has no coordinates.</p>`;
if(w.s==='load')return html`<p className="text-sm text-slate-500">Loading forecast…</p>`;
if(w.s==='err')return html`<${Note} k="warn">Forecast unavailable. The weather service could not be reached. Check your internet connection and try again.<//>`;
const j=w.j,d=j.daily;return html`<div><p className="fd text-3xl font-extrabold">${Math.round(j.current.temperature_2m)}°C <span className="text-sm font-normal text-slate-500">humidity ${j.current.relative_humidity_2m}%</span></p><div className="mt-2 divide-y text-sm">${d.time.map((x,i)=>html`<div key=${x} className="flex justify-between py-1"><span>${new Date(x).toLocaleDateString([], {weekday:'short'})}</span><span>${Math.round(d.temperature_2m_min[i])}–${Math.round(d.temperature_2m_max[i])}°C</span><span className="text-sky-700">${d.precipitation_sum[i]} mm</span></div>`)}</div></div>`}

function MapPick({pos,onPick}){const ref=useRef(),m=useRef(),mk=useRef();
useEffect(()=>{const map=L.map(ref.current,{zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false}).setView(pos||[22.5,79],pos?10:5);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);map.on('click',e=>onPick([e.latlng.lat,e.latlng.lng]));m.current=map;return()=>map.remove()},[]);
useEffect(()=>{if(!pos||!m.current)return;if(mk.current)mk.current.setLatLng(pos);else mk.current=L.circleMarker(pos,{radius:9,color:'#fff',weight:3,fillColor:'#047857',fillOpacity:1}).addTo(m.current);m.current.setView(pos,Math.max(m.current.getZoom(),9))},[pos&&pos.join()]);
return html`<div ref=${ref} className="h-72 sm:h-96 rounded-2xl overflow-hidden border border-emerald-900/15"></div>`}

function Soil({loc,setLoc,sens,log}){const[busy,setBusy]=useState(false),[err,setErr]=useState(''),[f,setF]=useState({village:'',district:'',state:'',pin:''}),r=loc.ri!=null?R[loc.ri]:null;
const pick=(ll,src)=>{if(ll[0]<6||ll[0]>37.5||ll[1]<68||ll[1]>98){setErr('That point is outside India. The built-in regional soil data covers India only.');return}setErr('');setLoc({ll,ri:near(ll),src});log('Farm location set by '+src)};
const gps=()=>{if(!navigator.geolocation){setErr('GPS is not available on this device. Use the map or enter details manually.');return}setBusy(true);navigator.geolocation.getCurrentPosition(p=>{setBusy(false);pick([p.coords.latitude,p.coords.longitude],'GPS')},e=>{setBusy(false);setErr(e.code===1?'Location permission was denied. Allow it in your browser, or use the map or manual entry.':'Could not get your location. Try the map or manual entry.')},{timeout:10000,enableHighAccuracy:true})};
const save=e=>{e.preventDefault();if(!f.state){setErr('Please choose a state.');return}if(f.pin&&!/^[1-9][0-9]{5}$/.test(f.pin)){setErr('PIN code must be 6 digits.');return}setErr('');setLoc({ri:SM[f.state],ll:null,src:'manual entry',...f});log('Farm details saved: '+(f.village||f.district||f.state))};
const inp='w-full border border-emerald-900/20 rounded-lg px-3 py-2 bg-white',rg=r&&r.ph.split('–').map(Number),pv=sens.last.ph;
return html`<div className="space-y-5"><${H}>${t('soil')}<//>
<div className="grid lg:grid-cols-2 gap-5"><div className="space-y-4">
<${Card}><button onClick=${gps} disabled=${busy} className="bg-emerald-700 text-white font-semibold rounded-xl px-4 py-2.5 hover:bg-emerald-800 disabled:opacity-60">📍 ${busy?'Finding you…':t('gps')}</button>
<form onSubmit=${save} className="mt-4 grid grid-cols-2 gap-3"><label className="text-sm">${t('village')}<input className=${inp} value=${f.village} onInput=${e=>setF({...f,village:e.target.value})}/></label><label className="text-sm">${t('district')}<input className=${inp} value=${f.district} onInput=${e=>setF({...f,district:e.target.value})}/></label>
<label className="text-sm">${t('state')}<select className=${inp} value=${f.state} onChange=${e=>setF({...f,state:e.target.value})}><option value="">Select state</option>${Object.keys(SM).sort().map(s=>html`<option key=${s}>${s}</option>`)}</select></label><label className="text-sm">${t('pin')}<input className=${inp} inputMode="numeric" maxLength="6" value=${f.pin} onInput=${e=>setF({...f,pin:e.target.value})}/></label>
<button className="col-span-2 border border-emerald-700 text-emerald-800 font-semibold rounded-xl py-2 hover:bg-emerald-50">${t('apply')}</button></form><//>
${err&&html`<${Note} k="bad">${err}<//>`}
<${MapPick} pos=${loc.ll} onPick=${ll=>pick(ll,'map')}/><p className="text-xs text-slate-500">Tap the map to place your farm. If the map background is blank, the map tiles could not load; the pin and soil lookup still work.</p></div>
<div>${r?html`<${Card} c="space-y-3"><div className="flex justify-between items-start gap-2"><div><h3 className="fd text-xl font-extrabold">${r.n}</h3><p className="text-sm text-slate-500">${r.st}</p></div><span className="text-[11px] font-bold bg-amber-100 text-amber-900 border border-amber-300 rounded-full px-2 py-0.5">${t('est')}</span></div>
${[['Soil types',r.s],['Typical pH',r.ph],['Fertility',r.f],['Climate',r.cl],['Common crops',r.cr]].map(x=>html`<p key=${x[0]} className="text-sm"><b>${x[0]}:</b> ${x[1]}</p>`)}
<div><p className="text-sm font-semibold">Suggested for this soil and climate</p><p className="text-sm mt-1">Kharif: ${r.k.join(', ')}</p><p className="text-sm">Rabi: ${r.r.join(', ')}</p></div>
<div className="rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-sm"><p className="font-semibold">Your sensor vs the regional range ${!sens.live&&html`<${Demo}/>`}</p><p>pH measured ${pv} · regional ${r.ph}: ${pv<rg[0]?'below the usual range, so liming may help':pv>rg[1]?'above the usual range':'within the usual range'}.</p></div><//>
<div className="mt-3"><${Note} k="warn">This is a regional estimate, not a test of your field. Soil can change within a few hundred metres, so farms in the same district can differ. For exact nutrient advice, get a Soil Health Card test from your local agriculture office.<//></div>`:html`<${Card}><p className="text-slate-600">Choose your farm location to see regional soil, fertility, climate and crop suggestions. Estimates are clearly marked and kept separate from sensor measurements.</p><//>`}</div></div></div>`}

function Detect({setHist,log}){const[crop,setCrop]=useState('Tomato'),[file,setFile]=useState(null),[url,setUrl]=useState(''),[st,setSt]=useState('idle'),[res,setRes]=useState(null),[err,setErr]=useState('');
const on=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!f.type.startsWith('image/')){setErr('Please choose an image file (JPG or PNG).');return}if(f.size>8e6){setErr('That image is over 8 MB. Choose a smaller photo.');return}setErr('');setRes(null);setSt('idle');setFile(f);setUrl(u=>{u&&URL.revokeObjectURL(u);return URL.createObjectURL(f)})};
const run=async()=>{setSt('load');setErr('');setRes(null);try{const j=await predict(file,crop),h=/healthy/i.test(j.label),r={name:h?'Healthy':pretty(j.label),healthy:h,conf:j.confidence,kb:h?KB.healthy:KB[norm(j.label)]};setRes(r);setSt('ok');setHist(a=>[{when:new Date().toLocaleString(),crop,name:r.name,conf:r.conf,healthy:h},...a]);log('Scan: '+crop+', '+r.name)}catch(e){setSt('err');setErr('The CNN model service is not reachable, so no prediction was made. Nothing is guessed. Connect the Flask/FastAPI endpoint at '+API+'/predict to get results.')}};
const demo=()=>{setRes({name:'Late blight',healthy:false,conf:.87,kb:KB['tomato late blight'],demo:1});setSt('ok')};
const btn='cursor-pointer inline-block font-semibold rounded-xl px-4 py-2.5 ';
return html`<div className="space-y-5"><${H}>${t('detect')}<//><div className="grid lg:grid-cols-2 gap-5">
<${Card} c="space-y-4"><label className="text-sm block">${t('crop')}<select className="w-full border border-emerald-900/20 rounded-lg px-3 py-2 bg-white" value=${crop} onChange=${e=>setCrop(e.target.value)}>${['Tomato','Potato','Maize','Pepper'].map(c=>html`<option key=${c}>${c}</option>`)}</select></label>
<div className="flex flex-wrap gap-2"><label className=${btn+'bg-emerald-700 text-white hover:bg-emerald-800'}><input type="file" accept="image/*" className="sr-only" onChange=${on}/>🖼️ ${t('upload')}</label><label className=${btn+'border border-emerald-700 text-emerald-800 hover:bg-emerald-50'}><input type="file" accept="image/*" capture="environment" className="sr-only" onChange=${on}/>📷 ${t('camera')}</label></div>
${url?html`<img src=${url} alt="Selected leaf" className="rounded-xl max-h-72 w-full object-contain bg-emerald-50"/>`:html`<div className="rounded-xl border-2 border-dashed border-emerald-300 bg-emerald-50 p-8 text-center text-sm text-emerald-900">Use a clear, well-lit photo of one leaf against a plain background.</div>`}
<button onClick=${run} disabled=${!file||st==='load'} className="w-full bg-lime-400 text-emerald-950 font-semibold rounded-xl py-3 hover:bg-lime-300 disabled:opacity-50">${st==='load'?'Analysing…':t('analyse')}</button><//>
<div className="space-y-3">${err&&html`<${Note} k=${st==='err'?'warn':'bad'}>${err}<//>`}
${st==='err'&&html`<button onClick=${demo} className="text-sm underline text-emerald-800">Preview the result layout with sample data</button>`}
${res?html`<${Card} c="space-y-3">${res.demo&&html`<${Note} k="warn"><b>${t('demo')}:</b> sample layout only, not a real prediction.<//>`}
<div className="flex justify-between items-start gap-2"><div><p className="text-sm text-slate-500">${crop}</p><h3 className=${'fd text-2xl font-extrabold '+(res.healthy?'text-emerald-700':'text-red-700')}>${res.name}</h3></div><span className=${'text-xs font-bold rounded-full px-3 py-1 '+(res.healthy?'bg-emerald-100 text-emerald-800':'bg-red-100 text-red-800')}>${res.healthy?'Healthy':'Infected'}</span></div>
<div><p className="text-sm">Confidence ${Math.round(res.conf*100)}%</p><div className="h-2 rounded bg-slate-100 mt-1"><div className="h-2 rounded bg-emerald-600" style=${{width:Math.round(res.conf*100)+'%'}}></div></div></div>
${res.conf<.6&&html`<${Note} k="warn">Low confidence. Retake the photo in better light, or show the plant to an agriculture officer.<//>`}
${res.kb?html`<div className="text-sm space-y-2"><p><b>Severity:</b> ${res.kb[0]}</p><p><b>Symptoms:</b> ${res.kb[1]}</p><div><b>Prevention</b><ul className="list-disc pl-5">${res.kb[2].split('; ').map(x=>html`<li key=${x}>${x}</li>`)}</ul></div></div>`:html`<${Note}>No guidance is stored yet for this class. Ask your local agriculture officer.<//>`}<//>`:st!=='err'&&html`<${Card}><p className="text-slate-600 text-sm">Results appear here with disease name, confidence, severity, symptoms and prevention. Predictions come only from the connected CNN model.</p><//>`}</div></div></div>`}

function IoT({sens}){const l=sens.last,al=alertsOf(l),D=[['Soil moisture sensor','Capacitive probe'],['DHT22','Temperature and humidity'],['Soil pH sensor','Analog probe'],['Light sensor','LDR or BH1750'],['ESP32-CAM','Leaf photos over Wi-Fi']];
return html`<div className="space-y-5"><div className="flex items-center gap-3 flex-wrap"><${H}>${t('iot')}<//>${sens.live?html`<span className="text-xs font-bold bg-emerald-100 text-emerald-800 rounded-full px-2 py-0.5">LIVE</span>`:html`<${Demo}/>`}</div>
${!sens.live&&html`<${Note} k="warn">No hardware is connected. Every reading and graph on this page is simulated DEMO DATA. They switch to live values once your ESP32 endpoint answers.<//>`}
<div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${M.map(m=>html`<${Card} key=${m[0]}><p className="text-sm text-slate-500">${m[1]} ${t(m[2])} <span className="text-slate-400">last 24 readings</span></p><p className="fd text-2xl font-extrabold">${l[m[0]]}${m[3]}</p><${Chart} d=${sens.s.map(x=>x[m[0]])} color=${m[4]} u=${m[3]}/><//>`)}</div>
<div className="grid md:grid-cols-2 gap-4"><${Card}><h3 className="font-semibold mb-2">Devices</h3><ul className="divide-y text-sm">${D.map(d=>html`<li key=${d[0]} className="flex justify-between py-2"><span>${d[0]}<span className="block text-xs text-slate-500">${d[1]}</span></span><span className=${sens.live?'text-emerald-700':'text-slate-500'}>${sens.live?'Online':'Not connected'}</span></li>`)}</ul><//>
<${Card}><h3 className="font-semibold mb-2">${t('alerts')}</h3><div className="space-y-2">${al.map(a=>html`<${Note} k=${a[0]} key=${a[1]}>${a[1]}<//>`)}${!al.length&&html`<p className="text-sm text-slate-500">No active alerts.</p>`}</div>
<h3 className="font-semibold mt-4 mb-1">Connect your ESP32</h3><p className="text-xs text-slate-600">The app polls GET ${API}/sensors/latest every 5 seconds. Your backend stores what the ESP32 posts to ${API}/sensors.</p><pre className="text-xs bg-emerald-950 text-emerald-100 rounded-lg p-3 mt-2 overflow-x-auto">{"m":48,"t":29.4,"h":63,"ph":6.8,"l":72}</pre><//></div></div>`}

function Profile({loc,hist,sens}){const[P,setP]=useState(()=>{try{return JSON.parse(localStorage.getItem('agro-profile'))||{}}catch(e){return{}}}),[rep,setRep]=useState('');
const up=(k,v)=>{const n={...P,[k]:v};setP(n);try{localStorage.setItem('agro-profile',JSON.stringify(n))}catch(e){}};
const mk=()=>{const r=loc.ri!=null?R[loc.ri]:null,av=k=>(sens.s.reduce((a,x)=>a+x[k],0)/sens.s.length).toFixed(1);setRep(['AGROVISION AI FARM REPORT','Generated: '+new Date().toLocaleString(),'','FARMER','Name: '+(P.name||'-')+' | Farm size: '+(P.acres||'-')+' acres | Crops: '+(P.crops||'-'),'','LOCATION','Source: '+(loc.src||'not set')+(loc.ll?' | '+loc.ll.map(x=>x.toFixed(4)).join(', '):'')+(loc.state?' | '+[loc.village,loc.district,loc.state,loc.pin].filter(Boolean).join(', '):''),'','SOIL (ESTIMATED REGIONAL DATA, NOT A FIELD MEASUREMENT)',r?r.n+': '+r.s+'; typical pH '+r.ph:'Not set','','SENSORS ('+(sens.live?'LIVE':'DEMO DATA, NOT REAL')+')','Moisture avg '+av('m')+'% | Temp avg '+av('t')+' C | Humidity avg '+av('h')+'% | pH avg '+av('ph'),'','DISEASE SCANS',...(hist.length?hist.map(h=>h.when+' | '+h.crop+' | '+h.name+' | '+Math.round(h.conf*100)+'%'):['No scans yet'])].join('\n'))};
const dl=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rep],{type:'text/plain'}));a.download='agrovision-report.txt';a.click()}catch(e){}};
const inp='w-full border border-emerald-900/20 rounded-lg px-3 py-2 bg-white';
return html`<div className="space-y-5"><${H}>${t('profile')}<//><div className="grid lg:grid-cols-2 gap-5">
<${Card} c="space-y-3"><h3 className="font-semibold">Farmer and farm details</h3>${[['name','Name'],['acres','Farm size (acres)'],['crops','Main crops']].map(x=>html`<label key=${x[0]} className="text-sm block">${x[1]}<input className=${inp} value=${P[x[0]]||''} onInput=${e=>up(x[0],e.target.value)}/></label>`)}<p className="text-xs text-slate-500">Saved in this browser only.</p><//>
<${Card} c="space-y-3"><h3 className="font-semibold">Detection history</h3>${hist.length?html`<ul className="text-sm divide-y">${hist.map((h,i)=>html`<li key=${i} className="py-1.5">${h.crop}: <b>${h.name}</b> (${Math.round(h.conf*100)}%) <span className="text-slate-400 text-xs">${h.when}</span></li>`)}</ul>`:html`<p className="text-sm text-slate-500">No scans yet. Real model results are saved here.</p>`}
<div className="flex gap-2 pt-2"><button onClick=${mk} className="bg-emerald-700 text-white font-semibold rounded-xl px-4 py-2 hover:bg-emerald-800">Create report</button>${rep&&html`<button onClick=${dl} className="border border-emerald-700 text-emerald-800 font-semibold rounded-xl px-4 py-2">Download .txt</button>`}</div><//></div>
${rep&&html`<${Card}><pre className="text-xs whitespace-pre-wrap overflow-x-auto">${rep}</pre><//>`}</div>`}

class EB extends React.Component{state={e:0};static getDerivedStateFromError(){return{e:1}}render(){return this.state.e?html`<div className="p-6"><${Note} k="bad">Something went wrong on this page. <a className="underline" href="#home" onClick=${()=>setTimeout(()=>location.reload(),50)}>Return home</a>.<//></div>`:this.props.children}}

const NAV=[['home','🏡','home'],['dashboard','📊','dash'],['soil','🗺️','soil'],['detect','🍃','detect'],['iot','📡','iot'],['profile','👤','profile']];
function App(){const[lang,setLang]=useState('en');LANG=lang;
const gr=()=>(location.hash||'#home').slice(1),[route,setRoute]=useState(gr()),[loc,setLoc]=useState({ri:null,ll:null}),[hist,setHist]=useState([]),[act,setAct]=useState([{t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),m:'Welcome to AgroVision AI. Sensor values are demo data until hardware connects.'}]),sens=useSensors(),w=useWeather(loc.ll);
useEffect(()=>{const f=()=>setRoute(gr());addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
const log=m=>setAct(a=>[{m,t:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})},...a].slice(0,6));
